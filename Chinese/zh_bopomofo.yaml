name: Chinese Zhuyin (注音)
languages: zh
description: Standard (大千式) Zhuyin keyboard. Tone 1 is entered with the space bar.
attributes: {moreKeyMode: OnlyExplicit}
autoShift: false
imeHint: "bopomofo"
rows:
  - letters: ['ㄅ', 'ㄉ', 'ˇ', 'ˋ', 'ㄓ', 'ˊ', '˙', 'ㄚ', 'ㄞ', 'ㄢ', 'ㄦ']
  - letters: ['ㄆ', 'ㄊ', 'ㄍ', 'ㄐ', 'ㄔ', 'ㄗ', 'ㄧ', 'ㄛ', 'ㄟ', 'ㄣ']
  - letters: ['ㄇ', 'ㄋ', 'ㄎ', 'ㄑ', 'ㄕ', 'ㄘ', 'ㄨ', 'ㄜ', 'ㄠ', 'ㄤ']
  - letters: ['ㄈ', 'ㄌ', 'ㄏ', 'ㄒ', 'ㄖ', 'ㄙ', 'ㄩ', 'ㄝ', 'ㄡ', 'ㄥ', $delete]
  - bottom:
    - $symbols
    - type: base
      spec: "英|_"
      code: -20
      attributes: { style: Functional }
    - ['，']
    - $action
    - $space
    - type: base
      spec: '。'
      moreKeys: ['…|……', '？', '！', '；', '：', '—|——']
      attributes: { moreKeyMode: OnlyExplicit }
    - $enter
subKeyboards:
  # English page, entered with the 英 key (code -20); 中 (code -19) returns to Zhuyin.
  # Keys here output ASCII, which the IME commits directly without going through Rime.
  Alphabet1:
    rows:
      - letters: q w e r t y u i o p
      - letters: a s d f g h j k l
      - letters: [$shift, z, x, c, v, b, n, m, $delete]
      - bottom:
        - $symbols
        - type: base
          spec: "中|_"
          code: -19
          attributes: { style: Functional }
        - $action
        - $space
        - type: base
          spec: '.'
          moreKeys: [',', '?', '!', "'"]
          attributes: { moreKeyMode: OnlyExplicit }
        - $enter
